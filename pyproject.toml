[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# pycodestyle errors and warnings, pyflakes, import order, bugbear, pyupgrade
select = ["E", "W", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# import the webpsql package from the project root without installing it
pythonpath = ["."]
markers = [
    "stand: test against a running stack (docker compose up); skipped if the stack is not reachable",
]
