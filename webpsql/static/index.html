<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Terminal · web-psql</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐘</text></svg>">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.css">
<link rel="stylesheet" href="/static/app.css">
<script src="/static/nav.js"></script>
</head>
<body>
<aside class="sidenav">
  <a class="brand" href="/" title="web-psql">
    <span class="brand-ic" aria-hidden="true">🐘</span><span class="nav-label">web-psql</span>
  </a>
  <nav>
    <a href="/" class="on" title="Terminal"><span class="nav-ic" aria-hidden="true">⌨️</span><span class="nav-label">Terminal</span></a>
    <a href="/sessions" title="Sessions"><span class="nav-ic" aria-hidden="true">🗂️</span><span class="nav-label">Sessions</span></a>
  </nav>
  <div class="sidenav-foot">
    <div class="status-pill busy" id="st-conn" title="Connection to the server"><i class="dot-st"></i><span class="nav-label" id="st-conn-text">connecting…</span></div>
    <div class="status-pill" id="st-db" title="Your own copy of the demo database"><i class="dot-st"></i><span class="nav-label" id="st-db-text">database copy…</span></div>
    <button class="nav-toggle" id="nav-toggle" type="button" title="Collapse / expand the panel" aria-label="Collapse / expand the panel">
      <span class="nav-ic" aria-hidden="true">«</span><span class="nav-label">Collapse</span>
    </button>
  </div>
</aside>
<main><div class="page">
  <section class="card hero">
    <div class="hero-head">
      <div>
        <div class="eyebrow">PostgreSQL sandbox</div>
        <h1>Terminal</h1>
        <p class="muted">
          A real <code>psql</code> with your own copy of the <code>bookstore</code> demo database.
          Drop tables, change data — “Start over” brings everything back.
        </p>
      </div>
      <div class="actions">
        <button class="primary" id="restart" type="button" title="Close psql and get a clean copy of the database">Start over</button>
        <button id="reconnect" type="button" title="Reconnect to the same session">Reconnect</button>
      </div>
    </div>
    <div class="examples">
      <span class="muted small">Try:</span>
      <button class="chip" type="button" data-sql="\dt+">\dt+</button>
      <button class="chip" type="button" data-sql="\d books">\d books</button>
      <button class="chip" type="button" data-sql="select * from top_authors;">select * from top_authors;</button>
      <button class="chip" type="button" data-sql="explain analyze select * from orders where customer_id = 42;">explain analyze …</button>
      <button class="chip" type="button" data-sql="drop table books cascade;">drop table books cascade;</button>
    </div>
  </section>

  <section class="card term-card">
    <div class="term-bar">
      <span class="dots" aria-hidden="true"><i></i><i></i><i></i></span>
      <span id="term-title">psql — bookstore</span>
      <span class="spacer"></span>
      <span>Copy <kbd>Ctrl+Shift+C</kbd> · paste <kbd>Ctrl+Shift+V</kbd></span>
    </div>
    <div id="terminal"></div>
  </section>
</div></main>

<script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.js"></script>
<script src="/static/terminal.js"></script>
</body>
</html>
