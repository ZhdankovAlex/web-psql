name: tests

on:
  push:
  pull_request:

jobs:
  # Quick check without Docker: linter and tests with Redis replaced by fakeredis.
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Unit tests
        run: python -m pytest tests/unit -q

  # The whole stack in docker compose and tests over a real WebSocket:
  # database copy, "break it and start over", sandbox restrictions, reconnect.
  stand:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Start stand
        run: docker compose up --build --detach --wait --wait-timeout 180

      - name: Stand tests
        env:
          STAND_REQUIRED: "1"
        run: python -m pytest tests/stand -v

      - name: Logs
        if: failure()
        run: docker compose logs --no-color

      - name: Stop stand
        if: always()
        run: docker compose down --volumes
